<!DOCTYPE html>
<html>
<head>
    <title>Tracking Dashboard</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

    <style>
        #map {
            height: 400px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<h2>📦 Order Tracking</h2>

<input id="orderId" placeholder="Enter Order ID">
<button onclick="startTracking()">Track</button>

<p id="status">Waiting...</p>

<!-- MAP -->
<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
let interval;
let map;
let marker;
let firstLoad = true;

function startTracking() {

    const orderId = document.getElementById("orderId").value;

    if (!orderId) {
        alert("Enter order id");
        return;
    }

    // Initialize map only once
    if (!map) {
        map = L.map('map').setView([12.9716, 77.5946], 15);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);
    }

    if (interval) clearInterval(interval);

    interval = setInterval(() => {

        fetch(`/get-location/${orderId}`)
        .then(res => res.json())
        .then(data => {

            if (!data) {
                document.getElementById("status").innerText = "No location yet";
                return;
            }

            const lat = data.latitude;
            const lng = data.longitude;

            document.getElementById("status").innerText =
                `📍 Lat: ${lat}, Lng: ${lng}`;

            // FIRST TIME → create marker
            if (!marker) {
                const bikeIcon = L.icon({
                    iconUrl: "https://cdn-icons-png.flaticon.com/512/2972/2972185.png", // bike icon
                    iconSize: [40, 40],
                    iconAnchor: [20, 20]
                });

                marker = L.marker([lat, lng], { icon: bikeIcon }).addTo(map);
                map.setView([lat, lng], 15);
                return;
            }

            // MOVE marker smoothly
            smoothMove(marker.getLatLng(), [lat, lng]);

        });

    }, 2000);
}

// 🔥 Smooth animation function
function smoothMove(from, to) {

    const frames = 20;
    let i = 0;

    const latStep = (to[0] - from.lat) / frames;
    const lngStep = (to[1] - from.lng) / frames;

    const interval = setInterval(() => {

        i++;

        const lat = from.lat + latStep * i;
        const lng = from.lng + lngStep * i;

        marker.setLatLng([lat, lng]);

        if (i >= frames) clearInterval(interval);

    }, 50);
}

</script>

</body>
</html>
