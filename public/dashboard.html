<!DOCTYPE html>
<html>

<head>
    <title>Delivery Tracking Dashboard</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <style>
        body {
            font-family: Arial;
            margin: 0;
            padding: 0;
        }

        .topbar {
            background: #111;
            color: white;
            padding: 15px;
            font-size: 20px;
        }

        .container {
            padding: 20px;
        }

        #map {
            height: 500px;
            margin-top: 20px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            background: #2e7d32;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1b5e20;
        }

        .status {
            margin-top: 20px;
            font-size: 16px;
        }
    </style>

</head>

<body>

    <div class="topbar">
        📦 Live Order Tracking
    </div>

    <div class="container">

        <p><b>Order ID:</b> <span id="orderIdText"></span></p>

        <p><b>Destination:</b> <span id="address">Loading...</span></p>

        <button onclick="openNavigation()">
            📍 View Live Route in Google Maps
        </button>

        <div class="status" id="status">
            Waiting for rider location...
        </div>

        <div id="map"></div>

    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>

        const orderId = new URLSearchParams(window.location.search).get("order_id");

        document.getElementById("orderIdText").innerText = orderId;

        let riderLat = null;
        let riderLng = null;

        let destLat = null;
        let destLng = null;

        let map;
        let riderMarker;
        let destMarker;
        let routeLine;


        /* ---------- INIT MAP ---------- */

        map = L.map('map').setView([13.08, 80.27], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);



        /* ---------- FETCH DESTINATION ---------- */

        fetch("/destination/" + orderId)

            .then(res => res.json())

            .then(data => {

                destLat = parseFloat(data.customer_lat);
                destLng = parseFloat(data.customer_lng);

                document.getElementById("address").innerText =
                    destLat + ", " + destLng;

                destMarker = L.marker([destLat, destLng])
                    .addTo(map)
                    .bindPopup("Customer Location");

                map.setView([destLat, destLng], 15);

            });



        /* ---------- TRACK RIDER ---------- */

        setInterval(() => {

            fetch("/get-location/" + orderId)

                .then(res => res.json())

                .then(data => {

                    if (!data) {

                        document.getElementById("status").innerText =
                            "Delivery not started yet";

                        return;

                    }

                    riderLat = parseFloat(data.latitude);
                    riderLng = parseFloat(data.longitude);

                    document.getElementById("status").innerText =
                        "🚴 Rider Location: " + riderLat + ", " + riderLng;

                    updateRider();

                });

        }, 2000);



        /* ---------- UPDATE RIDER MARKER ---------- */

        function updateRider() {

            if (!riderLat || !riderLng) return;

            if (!riderMarker) {

                const bikeIcon = L.icon({

                    iconUrl: "https://cdn-icons-png.flaticon.com/512/1046/1046784.png",
                    iconSize: [40, 40],
                    iconAnchor: [20, 20]

                });

                riderMarker = L.marker([riderLat, riderLng], { icon: bikeIcon })
                    .addTo(map)
                    .bindPopup("Delivery Rider");

            } else {

                riderMarker.setLatLng([riderLat, riderLng]);

            }

            drawRoute();

        }



        /* ---------- DRAW ROUTE ---------- */

        function drawRoute() {

            if (!destLat || !destLng) return;

            if (routeLine) {

                map.removeLayer(routeLine);

            }

            routeLine = L.polyline([

                [riderLat, riderLng],
                [destLat, destLng]

            ], {

                color: "blue",
                weight: 4

            }).addTo(map);

        }



        /* ---------- OPEN GOOGLE MAPS ---------- */

        function openNavigation() {

            if (!riderLat || !riderLng) {
                alert("Rider location unavailable");
                return;
            }

            const url =
                "https://www.google.com/maps/dir/?api=1&origin="
                + riderLat + "," + riderLng +
                "&destination=" + destLat + "," + destLng;

            window.open(url, "_blank");

        }

    </script>

</body>

</html>
